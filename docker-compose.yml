services:
  db:
    image: postgres:15
    container_name: saludcerca_db
    restart: always
    environment:
      POSTGRES_DB: saludcerca
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin1234
    ports:
      - "5432:5432"
    volumes:
      - saludcerca_data:/var/lib/postgresql/data

volumes:
  saludcerca_data: